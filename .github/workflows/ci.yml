name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Faddi.Check -c Release
      - name: Self-checks (scanner, cleanup rules, delete guard)
        run: dotnet run --project Faddi.Check -c Release --no-build
      - name: Translations
        run: node tools/i18n-check.mjs
